### Self-hosted local media pipeline (replaces cloud object storage)
### Media bytes live on the application host's disk — the storage path MUST be
### outside the deployment directory (redeploys never wipe media).
### Docker: bind-mount/named-volume a host dir to /data/incident-media (see compose.yaml).
### Native: create the dir and grant write permission to the app process user.
app.media.storage-path=${MEDIA_STORAGE_PATH:/data/incident-media}
### Terminal (RESOLVED/NON_RESOLVED) incident media older than this is purged daily.
app.media.retention-days=${MEDIA_RETENTION_DAYS:90}
### HMAC secret signing short-lived media read URLs (defaults to a dev value —
### always set MEDIA_SIGNING_SECRET in production).
app.media.signing-secret=${MEDIA_SIGNING_SECRET:}
app.media.read-token-ttl-minutes=${MEDIA_READ_TOKEN_TTL_MINUTES:15}

### Multipart upload limits — streamed to disk via MultipartFile.transferTo(),
### NEVER buffered into JVM heap. 30 MB per file / 35 MB per request covers
### the per-type caps (image ≤ 5 Mo, video ≤ 25 Mo, audio ≤ 5 Mo) plus form
### overhead. Location = dedicated temp dir with headroom (mount tmpfs/volume
### on hosts with constrained /tmp).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:35MB}
spring.servlet.multipart.location=${MULTIPART_LOCATION:${java.io.tmpdir}/icglma-media-uploads}

