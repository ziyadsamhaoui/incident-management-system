spring.application.name=incident-management-system
spring.profiles.active=dev

### PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:icglma_local}
spring.datasource.username=${DB_USER:icglma}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

### Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

### Redis (distributed state: JWT revocation, rate limiting, query caching, idempotency)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}

### Caching TTL strategy (seconds). Every cache entry MUST carry an explicit TTL.
### dashboard_stats is refreshed on every incident status mutation (@EvictDashboardCaches).
app.cache.default-ttl-seconds=${CACHE_DEFAULT_TTL_SECONDS:90}
app.cache.dashboard-ttl-seconds=${CACHE_DASHBOARD_TTL_SECONDS:90}
app.cache.analytics-ttl-seconds=${CACHE_ANALYTICS_TTL_SECONDS:120}

### Idempotency (X-Idempotency-Key) — atomic SETNX lock window for duplicate-submit protection.
app.idempotency.ttl-seconds=${IDEMPOTENCY_TTL_SECONDS:30}

### Storage path must be outside the deployment directory.
app.media.storage-path=${MEDIA_STORAGE_PATH:${java.io.tmpdir}/icglma-incident-media}

### Incident media (Status = RESOLVED / NON_RESOLVED) older than this is purged daily.
app.media.retention-days=${MEDIA_RETENTION_DAYS:90}

### HMAC secret signing short-lived media read URLs
app.media.signing-secret=${MEDIA_SIGNING_SECRET}
app.media.read-token-ttl-minutes=${MEDIA_READ_TOKEN_TTL_MINUTES:15}

### Upload limits
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:35MB}
spring.servlet.multipart.location=${MULTIPART_LOCATION:${java.io.tmpdir}/icglma-media-uploads}

### JWT configuration used for signing tokens
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

### Refresh token validity in milliseconds (604800000 = 7 days)
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

### Frontend URL (override per environment, ex: https://app.icglma.ma)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

### Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

### Disable mail health check in development
management.health.mail.enabled=false

### From address of outgoing reset emails (defaults to the SMTP username)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

### OpenAPI 3.0 specification + Swagger UI (springdoc-openapi)
### Interactive UI: http://localhost:8080/swagger-ui/index.html
### Raw JSON spec: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.default-produces-media-type=application/json
