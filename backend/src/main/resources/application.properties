spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

### Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
### baseline-version must be a valid numeric Flyway version: Flyway 12 rejects
### non-numeric values with "Version may only contain 0..9 and . (dot)".
### 1 = on legacy non-empty DBs, adopt the schema as V1 and apply V2+.
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true


### Redis (distributed state: JWT revocation, rate limiting, query caching, idempotency)
### Overridable per environment: SPRING_REDIS_HOST / SPRING_REDIS_PORT / SPRING_REDIS_PASSWORD
### (relaxed binding from the spring.data.redis.* keys below).
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_REDIS_DATABASE:0}
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}

### Caching TTL strategy (seconds). Every cache entry MUST carry an explicit TTL.
### dashboard_stats is refreshed on every incident status mutation (@EvictDashboardCaches);
### analytics_metrics holds the heavier DATE_TRUNC aggregations (120s freshness budget).
app.cache.default-ttl-seconds=${CACHE_DEFAULT_TTL_SECONDS:90}
app.cache.dashboard-ttl-seconds=${CACHE_DASHBOARD_TTL_SECONDS:90}
app.cache.analytics-ttl-seconds=${CACHE_ANALYTICS_TTL_SECONDS:120}

### Idempotency (X-Idempotency-Key) — atomic SETNX lock window for duplicate-submit protection.
app.idempotency.ttl-seconds=${IDEMPOTENCY_TTL_SECONDS:30}

### Storage path must be outside the deployment directory.
### NB: backslashes are escape characters in .properties files (\i would be
### silently dropped) — use forward slashes, which Java NIO accepts on Windows.
app.media.storage-path=${MEDIA_STORAGE_PATH:D:/icglma/incident-media}

### Incident media (Status = RESOLVED / NON_RESOLVED) older than this is purged daily.
app.media.retention-days=${MEDIA_RETENTION_DAYS:90}

### HMAC secret signing short-lived media read URLs
app.media.signing-secret=${MEDIA_SIGNING_SECRET:79fb7b946f5cc66ab5209f38755df20101c279aa24bf5ddaa3bc6f9af7a2980f}
app.media.read-token-ttl-minutes=${MEDIA_READ_TOKEN_TTL_MINUTES:15}

### Upload limits
