# Incident Management System: CI/CD Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch (PR or push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment-level variables for run steps
env:
  POSTGRES_DB: icglma_local
  POSTGRES_USER: icglma
  POSTGRES_PASSWORD: ICGLMA@2025

# Workflow Jobs
jobs:

  # JOB 1: Build, Static Analysis & Integration Tests
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    # PostgreSQL 17 Docker sidecar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: icglma_local
          POSTGRES_USER: icglma
          POSTGRES_PASSWORD: ICGLMA@2025
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (Temurin) with Maven dependency caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Cache Maven repository
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Verify DB connectivity to sidecar
      - name: Verify PostgreSQL connection
        run: |
          pg_isready -h localhost -p 5432
          echo "PostgreSQL 17 sidecar is ready."

      # Fix permissions for Linux runner
      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      # 5. Full build with code analysis and integration tests
      # Note: Maven requires pom.xml in the working directory — run from backend/.
      - name: Build, analyze & verify with Maven
        run: ./mvnw clean verify -B -V
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ env.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ env.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          # Dummy secrets for the Spring context to start during integration tests.
          # Tests never exercise real JWT/SMTP/media signing; only values that are
          # syntactically valid (BASE64 JWT secret ≥ 256 bits) are required.
          JWT_SECRET: cGlwZWxpbmUtZHVtbXktc2VjcmV0LXBpcGVsaW5lLWR1bW15LXNlY3JldC1waXBlbGluZQ==
          MEDIA_SIGNING_SECRET: pipeline-dummy-media-signing-secret
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          MAIL_USERNAME: pipeline-dummy@mail.local
          MAIL_PASSWORD: pipeline-dummy

      # 6. Upload test report
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      # 7. Upload static-analysis reports
      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: backend/target/pmd.xml
          retention-days: 7

  # JOB 2: Automated Deployment
  deploy:
    name: Deploy to Company Server
    # replace with " false " with " github.event_name == 'push' " if you have a valid SSH key
    if: false
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # 2. Set up JDK 17 to build the deployable artifact
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
 
      # 3. Package the Spring Boot application as an executable JAR
      - name: Package application
        run: ./mvnw clean package -DskipTests -B
        working-directory: backend
 
      # 4. Configure SSH access to the on-premise company server
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
 
      # 5. Transfer the built JAR to the company server
      - name: Copy artifact to server
        run: |
          scp -i ~/.ssh/deploy_key \
            backend/target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/icglma/app.jar
 
      # 6. Restart the systemd-managed service on the server
      - name: Restart application service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl restart icglma.service && sleep 5 && sudo systemctl status icglma.service --no-pager"
 
      # 7. Post-deployment health check against the internal server endpoint
      - name: Verify deployment health
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -sf http://localhost:8080/actuator/health || exit 1"
