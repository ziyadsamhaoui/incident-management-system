services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=icglma_local'
      - 'POSTGRES_PASSWORD=ICGLMA@2025'
      - 'POSTGRES_USER=icglma'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U icglma -d icglma_local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # Distributed state: JWT revocation, rate-limit buckets, query caches,
  # idempotency keys. Env-configurable via REDIS_PORT (default 6379).
  redis:
    image: 'redis:7-alpine'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/icglma_local
      SPRING_DATASOURCE_USERNAME: icglma
      SPRING_DATASOURCE_PASSWORD: ICGLMA@2025

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      MEDIA_STORAGE_PATH: /data/incident-media
      MEDIA_SIGNING_SECRET: 79fb7b946f5cc66ab5209f38755df20101c279aa24bf5ddaa3bc6f9af7a2980f
    volumes:
      - media-data:/data/incident-media
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  redis-data:
